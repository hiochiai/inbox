name: Build and Deploy

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME_BASE: inbox

jobs:
  test-launcher:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Test argument forwarding
      run: bash tests/inbox_arguments.sh

  build-antigravity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract INBOX_VERSION
      id: inbox-version
      run: |
        VERSION=$(grep '^INBOX_VERSION=' inbox | cut -d'=' -f2 | tr -d '"')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    # The containerd image store can load a multi-platform image for testing.
    - name: Set up Docker
      uses: docker/setup-docker-action@v5
      with:
        daemon-config: |
          {
            "features": { "containerd-snapshotter": true }
          }

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Get latest Antigravity CLI version
      id: antigravity-version
      run: |
        # Extract DOWNLOAD_BASE_URL from install.sh
        BASE_URL=$(curl -fsSL https://antigravity.google/cli/install.sh | grep '^DOWNLOAD_BASE_URL=' | cut -d'"' -f2)
        PLATFORM="linux_amd64.json"
        MANIFEST_URL="${BASE_URL}/manifests/${PLATFORM}"
        # Fetch manifest and parse version using sed (matches install.sh logic)
        VERSION=$(curl -fsSL "$MANIFEST_URL" | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    # Always validate the current source before publishing.
    - name: Build Antigravity image for testing
      uses: docker/build-push-action@v5
      with:
        context: ./boxes/antigravity
        platforms: linux/amd64,linux/arm64
        load: true
        push: false
        tags: inbox-antigravity:test
        cache-from: type=gha,scope=antigravity
        cache-to: type=gha,scope=antigravity,mode=max

    - name: Test Antigravity container on both architectures
      run: |
        for platform in linux/amd64 linux/arm64; do
          docker run --rm --platform "$platform" inbox-antigravity:test --help
        done

    - name: Log in to GitHub Container Registry
      if: github.event_name == 'push' || github.event_name == 'schedule'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_GHCR }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Antigravity image
      if: github.event_name == 'push' || github.event_name == 'schedule'
      uses: docker/build-push-action@v5
      with:
        context: ./boxes/antigravity
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_BASE }}:${{ steps.inbox-version.outputs.version }}-antigravity${{ steps.antigravity-version.outputs.version }}
          ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_BASE }}:${{ steps.inbox-version.outputs.version }}-antigravity
          ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_BASE }}:latest-antigravity
        cache-from: type=gha,scope=antigravity
        cache-to: type=gha,scope=antigravity,mode=max

  build-claude:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract INBOX_VERSION
      id: inbox-version
      run: |
        VERSION=$(grep '^INBOX_VERSION=' inbox | cut -d'=' -f2 | tr -d '"')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    # The containerd image store can load a multi-platform image for testing.
    - name: Set up Docker
      uses: docker/setup-docker-action@v5
      with:
        daemon-config: |
          {
            "features": { "containerd-snapshotter": true }
          }

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Get latest Claude CLI version
      id: claude-version
      run: |
        LATEST_VERSION=$(npm view @anthropic-ai/claude-code version)
        echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT

    # Always validate the current source before publishing.
    - name: Build Claude image for testing
      uses: docker/build-push-action@v5
      with:
        context: ./boxes/claude
        platforms: linux/amd64,linux/arm64
        build-args: |
          CLAUDE_CODE_VERSION=${{ steps.claude-version.outputs.version }}
        load: true
        push: false
        tags: inbox-claude:test
        cache-from: type=gha,scope=claude
        cache-to: type=gha,scope=claude,mode=max

    - name: Test Claude container on both architectures
      run: |
        for platform in linux/amd64 linux/arm64; do
          docker run --rm --platform "$platform" inbox-claude:test --help
        done

    - name: Log in to GitHub Container Registry
      if: github.event_name == 'push' || github.event_name == 'schedule'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_GHCR }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Claude image
      if: github.event_name == 'push' || github.event_name == 'schedule'
      uses: docker/build-push-action@v5
      with:
        context: ./boxes/claude
        platforms: linux/amd64,linux/arm64
        build-args: |
          CLAUDE_CODE_VERSION=${{ steps.claude-version.outputs.version }}
        push: true
        tags: |
          ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_BASE }}:${{ steps.inbox-version.outputs.version }}-claude${{ steps.claude-version.outputs.version }}
          ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_BASE }}:${{ steps.inbox-version.outputs.version }}-claude
          ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_BASE }}:latest-claude
        cache-from: type=gha,scope=claude
        cache-to: type=gha,scope=claude,mode=max

  prepare-codex:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      inbox-version: ${{ steps.inbox-version.outputs.version }}
      codex-version: ${{ steps.codex-version.outputs.version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract INBOX_VERSION
      id: inbox-version
      run: |
        VERSION=$(grep '^INBOX_VERSION=' inbox | cut -d'=' -f2 | tr -d '"')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    # Resolve once so both architectures install the same CLI version.
    - name: Get latest Codex CLI version
      id: codex-version
      run: |
        LATEST_VERSION=$(npm view @openai/codex version)
        echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT

  build-codex:
    needs: prepare-codex
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      CODEX_VERSION: ${{ needs.prepare-codex.outputs.codex-version }}
      ARCH: ${{ matrix.arch }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Verify native Docker architecture
      run: |
        case "$ARCH" in
          amd64) EXPECTED_ARCH=x86_64 ;;
          arm64) EXPECTED_ARCH=aarch64 ;;
          *) exit 1 ;;
        esac
        test "$(uname -m)" = "$EXPECTED_ARCH"
        docker info

    # Always validate the current source, even when a version tag already exists.
    - name: Build Codex image for testing
      uses: docker/build-push-action@v5
      with:
        context: ./boxes/codex
        platforms: linux/${{ matrix.arch }}
        build-args: |
          CODEX_VERSION=${{ env.CODEX_VERSION }}
        load: true
        push: false
        tags: inbox-codex:test
        cache-from: type=gha,scope=codex-${{ matrix.arch }}
        cache-to: type=gha,scope=codex-${{ matrix.arch }},mode=max

    - name: Test Codex container on native architecture
      run: |
        docker run --rm --platform "linux/$ARCH" inbox-codex:test --help
        ACTUAL_VERSION=$(docker run --rm --platform "linux/$ARCH" inbox-codex:test --version)
        test "$ACTUAL_VERSION" = "codex-cli $CODEX_VERSION"
        docker run --rm --platform "linux/$ARCH" -e INBOX_SIGN_IN_WITH_CHATGPT=1 inbox-codex:test --version
        docker run --rm --platform "linux/$ARCH" --entrypoint node -v "$PWD/tests:/tests:ro" inbox-codex:test /tests/codex-sign-in-with-chatgpt.cjs /usr/local/lib/inbox/sign-in-with-chatgpt.cjs

    - name: Log in to GitHub Container Registry
      if: github.event_name == 'push' || github.event_name == 'schedule'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_GHCR }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Codex image by digest
      if: github.event_name == 'push' || github.event_name == 'schedule'
      id: push
      uses: docker/build-push-action@v5
      with:
        context: ./boxes/codex
        platforms: linux/${{ matrix.arch }}
        build-args: |
          CODEX_VERSION=${{ env.CODEX_VERSION }}
        outputs: type=image,name=${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_BASE }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=codex-${{ matrix.arch }}
        cache-to: type=gha,scope=codex-${{ matrix.arch }},mode=max

    - name: Export Codex image digest
      if: github.event_name == 'push' || github.event_name == 'schedule'
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
        mkdir -p "$RUNNER_TEMP/codex-digests"
        printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/codex-digests/$ARCH"

    - name: Upload Codex image digest
      if: github.event_name == 'push' || github.event_name == 'schedule'
      uses: actions/upload-artifact@v4
      with:
        name: codex-digest-${{ matrix.arch }}
        path: ${{ runner.temp }}/codex-digests/${{ matrix.arch }}
        if-no-files-found: error
        retention-days: 1
        overwrite: true

  publish-codex:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: [prepare-codex, build-codex]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      INBOX_VERSION: ${{ needs.prepare-codex.outputs.inbox-version }}
      CODEX_VERSION: ${{ needs.prepare-codex.outputs.codex-version }}

    steps:
    - name: Download Codex image digests
      uses: actions/download-artifact@v4
      with:
        path: ${{ runner.temp }}/codex-digests
        pattern: codex-digest-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_GHCR }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Update public tags only after both native builds and tests pass.
    - name: Publish multi-platform Codex image
      env:
        IMAGE: ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_BASE }}
      run: |
        SOURCES=()
        for arch in amd64 arm64; do
          DIGEST=$(cat "$RUNNER_TEMP/codex-digests/$arch")
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          SOURCES+=("$IMAGE@$DIGEST")
        done
        docker buildx imagetools create \
          --tag "$IMAGE:$INBOX_VERSION-codex$CODEX_VERSION" \
          --tag "$IMAGE:$INBOX_VERSION-codex" \
          --tag "$IMAGE:latest-codex" \
          "${SOURCES[@]}"
        docker buildx imagetools inspect "$IMAGE:$INBOX_VERSION-codex$CODEX_VERSION"

  build-gemini:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract INBOX_VERSION
      id: inbox-version
      run: |
        VERSION=$(grep '^INBOX_VERSION=' inbox | cut -d'=' -f2 | tr -d '"')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    # The containerd image store can load a multi-platform image for testing.
    - name: Set up Docker
      uses: docker/setup-docker-action@v5
      with:
        daemon-config: |
          {
            "features": { "containerd-snapshotter": true }
          }

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Get latest Gemini CLI version
      id: gemini-version
      run: |
        LATEST_VERSION=$(npm view @google/gemini-cli version)
        echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT

    # Always validate the current source before publishing.
    - name: Build Gemini image for testing
      uses: docker/build-push-action@v5
      with:
        context: ./boxes/gemini
        platforms: linux/amd64,linux/arm64
        build-args: |
          GEMINI_CLI_VERSION=${{ steps.gemini-version.outputs.version }}
        load: true
        push: false
        tags: inbox-gemini:test
        cache-from: type=gha,scope=gemini
        cache-to: type=gha,scope=gemini,mode=max

    - name: Test Gemini container on both architectures
      run: |
        for platform in linux/amd64 linux/arm64; do
          docker run --rm --platform "$platform" inbox-gemini:test --help
        done

    - name: Log in to GitHub Container Registry
      if: github.event_name == 'push' || github.event_name == 'schedule'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_GHCR }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Gemini image
      if: github.event_name == 'push' || github.event_name == 'schedule'
      uses: docker/build-push-action@v5
      with:
        context: ./boxes/gemini
        platforms: linux/amd64,linux/arm64
        build-args: |
          GEMINI_CLI_VERSION=${{ steps.gemini-version.outputs.version }}
        push: true
        tags: |
          ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_BASE }}:${{ steps.inbox-version.outputs.version }}-gemini${{ steps.gemini-version.outputs.version }}
          ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_BASE }}:${{ steps.inbox-version.outputs.version }}-gemini
          ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_BASE }}:latest-gemini
        cache-from: type=gha,scope=gemini
        cache-to: type=gha,scope=gemini,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test-launcher, build-antigravity, build-claude, build-codex, publish-codex, build-gemini]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          inbox
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
